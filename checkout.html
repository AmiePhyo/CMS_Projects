<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | QuickBite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body onload="displayCheckoutTotal()">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">QuickBite Delivery</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cartCount" class="cart-count-badge">0</span></a></li>
        <li class="nav-item"><a class="nav-link active" href="checkout.html">Checkout</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
<section class="page-header">
  <h1>Checkout & Payment</h1>
  <p>Choose payment method and confirm your order.</p>
</section>

<main class="container py-5">
  <form class="checkout-form" onsubmit="placeOrder(event)">
    <input type="text" class="form-control mb-3" placeholder="Full Name" required>
    <input type="tel" class="form-control mb-3" placeholder="Phone Number" required>
    <textarea class="form-control mb-3" placeholder="Delivery Address" required></textarea>

    <label class="fw-bold mb-2">Payment Method</label>
    <select class="form-select mb-3" required>
      <option value="">Choose payment</option>
      <option>Cash on Delivery</option>
      <option>Credit / Debit Card</option>
      <option>PayNow</option>
      <option>GrabPay</option>
      <option>Apple Pay / Google Pay</option>
    </select>

    <h4>Total Payment: $<span id="checkoutTotal">0.00</span></h4>
    <button class="btn btn-danger btn-lg mt-3">Pay & Place Order</button>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
